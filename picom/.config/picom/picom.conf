#################################
#           Global              #
#################################

# Watch config file changes
watch-config-file = true;

# Backend and Sync
backend = "glx";
vsync = true;

# AMD Specific Performance Tweaks
#glx-no-stencil = true;
#glx-no-rebind-pixmap = true;
#use-damage = true;

#################################
#           Animations          #
#################################

# FT-Labs animation block
animations = true;
animation-stiffness = 200;
animation-damping = 20;
animation-clamping = true;
animation-mass = 1;

# Custom window triggers
# Options: zoom, slide-up, slide-down, fly-in
animation-for-open-window = "zoom";
animation-for-close-window = "slide-down";

#################################
#           Fading              #
#################################

# Default: false
fading = true;
# Opacity change between steps while fading in. (0.01 - 1.0, defaults to 0.028)
fade-in-step = 0.10;
# Opacity change between steps while fading out. (0.01 - 1.0, defaults to 0.03)
fade-out-step = 0.10;

#################################
#           Corners             #
#################################

# Round corners
corner-radius = 20;
round-borders = 1;
# Excluded round corners
rounded-corners-exclude = [
  "class_g = 'i3bar'"
];

#################################
#   Transparency / Opacity      #
#################################

# Blur settings
blur: {
  method = "dual_kawase";
  strength = 3;
  background = false;
  background-frame = false;
  background-fixed = false;
};

# Ensure picom tracks window focus state
track-shadow-focused = true;
detect-client-opacity = true;

# Alacritty
opacity-rule = [
    "100:class_g = 'Alacritty' && focused",
    "85:class_g = 'Alacritty' && !focused"
];
